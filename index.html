
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Periodic Table Finder</title>

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module"
            src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #fff0f5;
            font-family: Arial, sans-serif;
            color: #7a3154;
        }

        .main-card {
            max-width: 550px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border: 2px solid #ffc1d6;
            border-radius: 25px;
            box-shadow: 0 8px 20px #e8a5bf66;
        }

        .heading {
            color: #d63384;
            font-weight: bold;
        }

        .subtitle {
            color: #a45b7d;
        }

        .form-control {
            border: 2px solid #f5b6ce;
            border-radius: 12px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #e75480;
            box-shadow: 0 0 5px #f4a6c1;
        }

        .pink-button {
            background: #e75480;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: bold;
            transition: 0.3s;
        }

        .pink-button:hover {
            background: #c93669;
            color: white;
        }

        .result-box {
            background: #fff5f8;
            border: 1px solid #ffc1d6;
            border-radius: 16px;
            padding: 20px;
        }

        .result-item {
            background: white;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        .result-label {
            font-weight: bold;
            color: #d63384;
        }

        .footer {
            color: #b56b8b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="main-card">

            <div class="text-center mb-4">
                <h1 class="heading">Periodic Table</h1>
                <h3 class="heading">Information Finder ♡</h3>
                <p class="subtitle mt-3">
                    Discover the details of non-metal elements!
                </p>
            </div>

            <label for="symbol" class="form-label fw-bold">
                Enter Element Symbol
            </label>

            <input type="text"
                   id="symbol"
                   class="form-control mb-3"
                   placeholder="Example: O, H, or Cl">

            <button py-click="search_element"
                    class="btn pink-button w-100">
                Search Element ♡
            </button>

            <div class="result-box mt-4">
                <h5 class="heading mb-3">Element Details</h5>

                <div class="result-item">
                    <span class="result-label">Symbol:</span>
                    <span id="element_symbol">-</span>
                </div>

                <div class="result-item">
                    <span class="result-label">Element Name:</span>
                    <span id="element_name">-</span>
                </div>

                <div class="result-item">
                    <span class="result-label">Atomic Number:</span>
                    <span id="atomic_number">-</span>
                </div>

                <div class="result-item mb-0">
                    <span class="result-label">Atomic Mass:</span>
                    <span id="atomic_mass">-</span>
                </div>

                <p id="message" class="text-danger mt-3 mb-0"></p>
            </div>

            <p class="footer text-center mt-4 mb-0">
                Made with love for Science ♡
            </p>

        </div>
    </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
